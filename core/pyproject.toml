[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memcard"
version = "0.1.0"
description = "Two-way game save sync backed by your own cloud storage"
requires-python = ">=3.11"
license = "MIT"
# tomlkit is only imported when Memcard writes config.toml, so the hot paths
# (wrap, sync, status) stay stdlib-only.
dependencies = ["tomlkit>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memcard = "memcard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real rsync and rclone binaries"]
